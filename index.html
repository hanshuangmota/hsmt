<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal</title>
<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #00ff66;
        font-family: Consolas, "Courier New", monospace;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .terminal {
        width: 92%;
        height: 88%;
        border: 1px solid #00aa44;
        background: rgba(0, 10, 4, 0.96);
        box-shadow:
            0 0 20px rgba(0,255,80,.25),
            inset 0 0 40px rgba(0,255,80,.04);
        position: relative;
        overflow: hidden;
    }

    .titlebar {
        height: 34px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        background: #07140b;
        border-bottom: 1px solid #006b2b;
        color: #7cffaa;
        font-size: 13px;
    }

    .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 6px;
        background: #00ff66;
        box-shadow: 0 0 8px #00ff66;
    }

    #output {
        padding: 18px;
        height: calc(100% - 34px);
        overflow: hidden;
        font-size: 15px;
        line-height: 1.55;
        text-shadow: 0 0 5px rgba(0,255,100,.5);
    }

    .line {
        white-space: pre-wrap;
    }

    .warning {
        color: #ffcc00;
    }

    .danger {
        color: #ff3333;
        text-shadow: 0 0 8px rgba(255,0,0,.7);
    }

    .success {
        color: #00ff99;
    }

    .cyan {
        color: #00ffff;
    }

    .cursor {
        display: inline-block;
        width: 8px;
        height: 16px;
        background: #00ff66;
        vertical-align: -3px;
        animation: blink .7s infinite;
    }

    @keyframes blink {
        50% { opacity: 0; }
    }

    .scanline {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            repeating-linear-gradient(
                to bottom,
                rgba(0,255,100,.025) 0px,
                rgba(0,255,100,.025) 1px,
                transparent 1px,
                transparent 4px
            );
    }

    .flash {
        animation: flash .15s 2;
    }

    @keyframes flash {
        50% { filter: brightness(2); }
    }
</style>
</head>

<body>

<div class="terminal" id="terminal">
    <div class="titlebar">
        <span class="dot"></span>
        SECURE TERMINAL // CONNECTION ESTABLISHED
    </div>

    <div id="output"></div>
    <div class="scanline"></div>
</div>

<script>
const output = document.getElementById("output");
const terminal = document.getElementById("terminal");

const lines = [
    ["SYSTEM BOOT", "success"],
    ["Initializing secure shell...", ""],
    ["Loading kernel modules............... OK", ""],
    ["Establishing encrypted channel....... OK", ""],
    ["Checking firewall.................... OK", ""],
    ["Scanning local environment........... OK", ""],
    ["", ""],
    ["[+] TARGET IDENTIFIED", "cyan"],
    ["Analyzing connection...", ""],
    ["Resolving network route.............. OK", ""],
    ["Checking security layer.............. OK", ""],
    ["Bypassing imaginary firewall........ 100%", ""],
    ["", ""],
    ["WARNING: UNAUTHORIZED ACCESS DETECTED", "warning"],
    ["Attempting emergency override...", ""],
    ["Override progress: 13%", ""],
    ["Override progress: 37%", ""],
    ["Override progress: 68%", ""],
    ["Override progress: 91%", ""],
    ["Override progress: 100%", ""],
    ["", ""],
    ["ACCESS GRANTED", "danger"],
    ["", ""],
    ["Downloading top-secret files...", ""],
    ["████████████████████████████████ 100%", "success"],
    ["Decrypting classified data...", ""],
    ["████████████████████████████████ 100%", "success"],
    ["", ""],
    ["SYSTEM MESSAGE:", "cyan"],
    ["你已经被黑客攻击了。", "danger"],
    ["", ""],
    ["Just kidding :) 这是恶搞页面，没有进行任何真实操作。", "success"],
    ["", ""],
    ["Press ENTER to exit... ", ""]
];

let index = 0;

function addLine(text, cls = "") {
    const div = document.createElement("div");
    div.className = "line " + cls;
    div.textContent = text;
    output.appendChild(div);

    // 保持底部
    output.scrollTop = output.scrollHeight;
}

function typeLine(text, cls, callback) {
    const div = document.createElement("div");
    div.className = "line " + cls;
    output.appendChild(div);

    let i = 0;

    function type() {
        if (i < text.length) {
            div.textContent += text[i++];
            output.scrollTop = output.scrollHeight;

            const speed = Math.random() * 25 + 10;
            setTimeout(type, speed);
        } else {
            callback();
        }
    }

    type();
}

function run() {
    if (index >= lines.length) {
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        output.lastElementChild.appendChild(cursor);
        return;
    }

    const [text, cls] = lines[index++];

    typeLine(text, cls, () => {
        let delay = text === "" ? 150 : Math.random() * 450 + 150;

        if (text.includes("ACCESS GRANTED")) {
            terminal.classList.add("flash");
            setTimeout(() => terminal.classList.remove("flash"), 400);
            delay = 800;
        }

        setTimeout(run, delay);
    });
}

run();

document.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        output.innerHTML = "";
        index = 0;
        run();
    }
});
</script>

</body>
</html>
